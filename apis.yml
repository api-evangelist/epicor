name: Epicor

description: >-
  Epicor Software Corporation provides industry-specific enterprise resource planning
  software for manufacturing, distribution, retail, and service industries. Epicor
  Kinetic, the flagship ERP platform, exposes an Open REST API built on OData v4 that
  gives developers service-based access to all business objects, processes, reports,
  BAQs, and Epicor Functions using standard HTTP methods and API key authentication.

