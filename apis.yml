apis:
  - aid: epicor:epicor-kinetic-rest-api
    name: Epicor Kinetic Open REST API
    description: >-
      The Epicor Kinetic Open REST API exposes all ERP capabilities through OData v4
      compliant endpoints covering business objects, processes, reports, Business Activity
      Queries (BAQs), and custom Epicor Functions. Access is controlled via API keys and
      scopes aligned with existing ERP user permissions. The built-in interactive help
      allows browsing services, inspecting metadata, and testing calls before integration.
